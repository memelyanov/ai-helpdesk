spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:aihelpdesk}
    username: ${POSTGRES_USER:aihelpdesk}
    password: ${POSTGRES_PASSWORD:aihelpdesk}
  servlet:
    multipart:
      # Deliberately above FR-003's 20 MB business limit (DocumentController enforces that number
      # itself, producing a consistent `invalid_file` response). This is only a container-level
      # safety net so an absurdly large request is rejected before Spring even buffers it fully.
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    # Auto-configuration gate — load-bearing, not tidiness. Each of Spring AI's four Azure OpenAI
    # model auto-configurations (chat, embedding, image, audio transcription) is
    # @ConditionalOnProperty(havingValue = "azure-openai", matchIfMissing = true) and, whichever one
    # activates, @Imports AzureOpenAiClientBuilderConfiguration, which fails startup with
    # "Endpoint must not be empty" when credentials are absent (FR-019). All four MUST be defaulted
    # to "none" — leaving even one unset re-triggers it via matchIfMissing.
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
    azure:
      openai:
        api-key: ${AZURE_OPEN_AI_KEY:}
        endpoint: ${AZURE_OPEN_AI_ENDPOINT:}
        chat:
          options:
            deployment-name: ${AZURE_OPEN_AI_DEPLOYMENT_NAME:}
        embedding:
          options:
            deployment-name: ${AZURE_OPEN_AI_EMBEDDING_DEPLOYMENT_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: http://localhost:4200
        allowed-methods: GET
  endpoint:
    health:
      show-details: always

logging:
  # Spring Boot's built-in rolling-file support (no custom logback-spring.xml needed): setting
  # logging.file.name adds a RollingFileAppender alongside the default console appender, so log
  # output goes to both places, not just console as before.
  file:
    name: logs/ai-helpdesk.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
  pattern:
    # Feature 009: Spring Boot's own default console/file patterns, extended additively with
    # %X{chatRequestId} (SLF4J MDC, research Decision 1) so every log line emitted while a chat
    # request is being processed carries its correlation id; blank for any line logged outside a
    # chat request (MDC key not set).
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{chatRequestId}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%t] [%X{chatRequestId}] %-40.40logger{39} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
